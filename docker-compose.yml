services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg://dashboard:dashboard@postgres:5432/dashboard
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.streamlit:/app/.streamlit:ro

volumes:
  postgres_data:
