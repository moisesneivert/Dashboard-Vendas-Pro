[tool.pytest.ini_options]
addopts = "-q --cov=src/dashboard --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
omit = ["src/dashboard/ui.py", "src/dashboard/charts.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
